name: Launch acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/seo.mjs --check
      - run: npx playwright install --with-deps chromium
      - run: node scripts/launch-browser.mjs
