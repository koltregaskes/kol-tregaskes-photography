name: Launch acceptance
on:
  pull_request:
  push:
    branches: [main]
env:
  PLAYWRIGHT_CHANNEL: msedge
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify installed Edge (no browser download)
        run: microsoft-edge --version
      - run: node scripts/launch-browser.mjs
      - name: Check safe contact draft and no-JavaScript fallback
        run: node scripts/check-contact-browser.mjs
