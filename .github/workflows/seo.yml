name: SEO contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/seo.mjs --check
      - name: Validate actual public output contract
        run: python3 scripts/check-seo-contract.py
      - name: Prove rejected SEO mutations
        run: node --test tests/seo-contract.test.mjs
