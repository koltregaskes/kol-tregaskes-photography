name: Security checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: node scripts/security-check.mjs

      - name: Check public static policy and data collection boundary
        run: node scripts/check-public-boundary.mjs
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci
      - name: Crawl external links (bot denials require manual review)
        continue-on-error: true
        run: node scripts/security-check.mjs --external

      - name: Crawl public digest and routed story destinations
        run: node scripts/check-news-links.mjs
