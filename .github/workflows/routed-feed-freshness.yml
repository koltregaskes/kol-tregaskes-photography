name: Routed feed freshness

on:
  workflow_dispatch:
  schedule:
    # 06:30 UTC daily. Fails when feed generation is at least one day old.
    # Article dates are informational; this check never fetches articles.
    - cron: '30 6 * * *'

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Warn when the routed feed was not replaced
        run: node scripts/check-routed-feed-freshness.mjs
