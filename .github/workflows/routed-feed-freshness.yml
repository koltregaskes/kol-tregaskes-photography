name: Routed feed freshness

on:
  workflow_dispatch:
  schedule:
    # 06:30 UTC every day. Fails once news-digests/news-feed-latest.json or its newest
    # item is 1 day old. No public feed URL exists, so this job does not
    # download or invent articles.
    - cron: '30 6 * * *'

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Warn when the routed feed was not replaced
        run: node scripts/check-routed-feed-freshness.mjs
